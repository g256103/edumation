<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edumation — しゃべって作って、手で動かす</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">edumation</span>
        <span class="brand-tag">しゃべって作って、手で動かす</span>
      </div>

      <nav class="units" aria-label="単元">
        <span class="units-label">中学数学</span>
        <button class="unit-chip is-active" data-template="circleArea">円の面積</button>
        <button class="unit-chip" data-template="linear">一次関数</button>
        <button class="unit-chip" data-template="quadratic">二次関数 y=ax²</button>
        <button class="unit-chip" data-template="inscribedAngle">円周角の定理</button>
        <button class="unit-chip" data-template="cubeSection">立方体の切断 <span class="chip-tag">3D</span></button>
      </nav>

      <div class="topbar-actions">
        <button id="micBtn" class="btn btn-mic" type="button" aria-pressed="false">
          <span class="mic-dot"></span>音声 OFF
        </button>
        <button id="camBtn" class="btn" type="button">カメラ ON</button>
        <button id="settingsBtn" class="btn btn-ghost" type="button" aria-expanded="false">設定</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage-wrap" aria-label="アニメーション">
        <canvas id="stage3d" hidden aria-hidden="true"></canvas>
        <canvas id="stage"></canvas>

        <div class="stage-hud stage-hud-top">
          <div id="equation" class="equation">円の面積 = πr²</div>
          <div id="verifyBadge" class="verify-badge verify-pending" role="status">検証待ち</div>
        </div>

        <div class="stage-hud stage-hud-bottom">
          <div id="paramReadout" class="param-readout">n = 8</div>
          <div id="caption" class="caption" aria-live="polite"></div>
        </div>

        <div id="handState" class="hand-state hand-none">手: 未検出 → 固定</div>
      </section>

      <aside class="side">
        <section class="card cam-card">
          <div class="card-title">手（つまみ）</div>
          <div class="cam-frame">
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="overlay"></canvas>
            <div id="camError" class="cam-error" hidden></div>
          </div>
          <div class="pinch-row">
            <span class="pinch-label">つまみ</span>
            <div class="pinch-meter"><div id="pinchFill" class="pinch-fill"></div></div>
            <span id="pinchValue" class="mono">0.00</span>
          </div>
          <div class="hint">親指と人差し指の間隔で、選択中のパラメータが連続で変わります。手を下ろすと固定。</div>
        </section>

        <section class="card">
          <div class="card-title">手で動かすパラメータ</div>
          <div id="paramChips" class="chips"></div>
          <input id="paramSlider" class="slider" type="range" min="0" max="1000" value="0" aria-label="パラメータ（マウス代替）" />
        </section>

        <section class="card">
          <div class="card-title">音声 / テキスト命令</div>
          <form id="cmdForm" class="cmd-form">
            <input id="cmdInput" type="text" placeholder="例: 円の面積の公式を説明して / 倍にして / 色を変えて" autocomplete="off" />
            <button class="btn" type="submit">送る</button>
          </form>
          <div id="transcript" class="transcript" aria-live="polite"></div>
          <ul id="cmdLog" class="cmd-log"></ul>
        </section>

        <section class="card">
          <div class="card-title">数値検証</div>
          <ul id="checkList" class="check-list"></ul>
          <div id="geminiVerifyState" class="hint">Gemini Code Execution: 未接続（設定でAPIキーを入れると実行）</div>
        </section>
      </aside>
    </main>

    <div id="settingsPanel" class="settings" hidden>
      <div class="settings-inner">
        <div class="card-title">設定</div>
        <label class="field">
          <span>Gemini API キー（ブラウザ内のみ保存）</span>
          <input id="geminiKey" type="password" placeholder="AIza..." autocomplete="off" />
        </label>
        <label class="field">
          <span>モデル</span>
          <input id="geminiModel" type="text" value="gemini-2.5-flash" />
        </label>
        <label class="field-check">
          <input id="ttsToggle" type="checkbox" checked />
          <span>ナレーション（ブラウザTTS）</span>
        </label>
        <label class="field-check">
          <input id="geminiInterpretToggle" type="checkbox" checked />
          <span>ルールで解釈できない命令は Gemini に送る</span>
        </label>
        <div class="settings-actions">
          <button id="settingsSave" class="btn" type="button">保存</button>
          <button id="settingsClose" class="btn btn-ghost" type="button">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
